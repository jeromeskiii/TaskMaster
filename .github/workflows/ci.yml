name: TaskMaster CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[semantic,dev]"

      - name: Validate all skills
        run: python3 taskmaster.py validate

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

  quality:
    name: Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e .

      - name: Check skill quality
        run: python3 taskmaster.py quality

      - name: Verify index is current
        run: |
          cp INDEX.md INDEX.md.bak
          python3 taskmaster.py generate-index
          diff INDEX.md INDEX.md.bak || {
            echo "✗ INDEX.md is out of date. Run: python3 taskmaster.py generate-index"
            exit 1
          }
          echo "✓ INDEX.md is up to date"

  phase1:
    name: Phase 1 Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install with semantic extras
        run: |
          python -m pip install -e ".[semantic,dev]"

      - name: Run Phase 1 tests
        run: |
          python -m pytest tests/test_embeddings_provider.py tests/test_embeddings_index.py tests/test_embeddings_text.py tests/test_recommend.py tests/test_compose.py tests/test_cli_phase1.py tests/test_validation_optional_fields.py -v
